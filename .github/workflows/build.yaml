name: build

on: [push, pull_request]

permissions:
  contents: read

env:
  UV_VERSION: "0.13.9"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync ruff check requests_ntlm2
      - run: uv run --no-sync bandit -r requests_ntlm2

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
          - "3.6.15-buster"
          - "3.7.17-bullseye"
          - "3.8.20-bookworm"
          - "3.9-bookworm"
          - "3.10-bookworm"
          - "3.11-bookworm"
          - "3.12-bookworm"
          - "3.13-bookworm"
    name: Test on Python ${{ matrix.python }}
    container: python:${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked --python /usr/local/bin/python --no-default-groups --group test
      - name: Test
        shell: bash
        run: |
          if openssl_modules=$(openssl version -m 2>/dev/null); then
            export OPENSSL_CONF="$PWD/tests/openssl-legacy.cnf"
            export OPENSSL_MODULES="$(cut -d '"' -f 2 <<< "$openssl_modules")"
          fi

          .venv/bin/python -m tests.test_server &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --silent --show-error --output /dev/null --retry 5 --retry-connrefused http://127.0.0.1:5000/ntlm
          uv run --no-sync --no-default-groups --group test pytest --cov --cov-report=term-missing tests/unit
      - name: Verify legacy package build
        if: startsWith(matrix.python, '3.6.') || startsWith(matrix.python, '3.7.')
        run: uv build --no-sources --python /usr/local/bin/python

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - run: uv build --no-sources
      - run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
