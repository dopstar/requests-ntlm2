name: build

on: [push, pull_request]

permissions:
  contents: read

env:
  UV_VERSION: "0.13.9"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - uses: extractions/setup-just@v4
      - run: just lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
          - "3.6.15-buster"
          - "3.7.17-bullseye"
          - "3.8.20-bookworm"
          - "3.9-bookworm"
          - "3.10-bookworm"
          - "3.11-bookworm"
          - "3.12-bookworm"
          - "3.13-bookworm"
    name: Test on Python ${{ matrix.python }}
    container: python:${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - uses: extractions/setup-just@v4
      - run: just test
        env:
          UV_PYTHON: /usr/local/bin/python
      - name: Verify legacy package build
        if: startsWith(matrix.python, '3.6.') || startsWith(matrix.python, '3.7.')
        run: just build
        env:
          UV_PYTHON: /usr/local/bin/python

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
      - uses: extractions/setup-just@v4
      - run: just build
      - run: just publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
