[build-system]
requires = ["flit_core>=3.11,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "requests-ntlm2"
version = "7.1.0"
description = "The HTTP NTLM proxy and/or server authentication library."
readme = "README.md"
requires-python = ">=3.6"
license = "ISC"
license-files = ["LICENSE"]
authors = [{ name = "Mkhanyisi Madlavana", email = "mmadlavana@gmail.com" }]
keywords = ["NTLM", "requests", "proxy", "authorization", "NTLM dance"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "requests>=2.0.0",
    "ntlm-auth>=1.0.2",
    "cryptography>=1.3",
]

[project.urls]
Documentation = "https://dopstar.github.io/requests-ntlm2"
Source = "https://github.com/dopstar/requests-ntlm2"
Tracker = "https://github.com/dopstar/requests-ntlm2/issues"

[dependency-groups]
dev = ["bandit", "basedpyright", "import-linter>=2.12", "ruff", "types-requests"]
test = ["faker", "flask", "pytest", "pytest-cov", "trustme==0.7.0"]

[tool.uv]
default-groups = ["dev", "test"]

[tool.uv.dependency-groups]
dev = { requires-python = ">=3.10" }

[tool.flit.sdist]
include = ["Justfile", "tests/"]
exclude = ["**/__pycache__/"]

[tool.ruff]
line-length = 100
target-version = "py37"

[tool.ruff.lint]
select = ["E", "F", "I", "Q", "W"]

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.coverage.run]
branch = true
source = ["requests_ntlm2"]

[tool.coverage.report]
fail_under = 100
# Keep type-checker-only code excluded on the older coverage.py used by Python 3.6.
exclude_lines = [
    "pragma: no cover",
    '^\s*if TYPE_CHECKING:',
]

[tool.basedpyright]
include = ["requests_ntlm2"]
pythonVersion = "3.6"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.importlinter]
root_package = "requests_ntlm2"

[[tool.importlinter.contracts]]
name = "Package modules must be acyclic"
type = "acyclic_siblings"
ancestors = ["requests_ntlm2"]

[[tool.importlinter.contracts]]
name = "Requests authentication and proxy transports are independent"
type = "independence"
modules = ["requests_ntlm2.auth", "requests_ntlm2.proxy"]

[[tool.importlinter.contracts]]
name = "Package initializers must stay free of internal imports"
type = "forbidden"
source_modules = ["requests_ntlm2", "requests_ntlm2.proxy", "requests_ntlm2.proxy.adapters"]
forbidden_modules = ["requests_ntlm2", "requests_ntlm2.**"]
as_packages = false
